
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: magnif
      POSTGRES_PASSWORD: magnif_dev_password
      POSTGRES_DB: magnif
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://magnif:magnif_dev_password@postgres:5432/magnif
      JWT_SECRET: ${JWT_SECRET}
      PAYNOW_INTEGRATION_ID: ${PAYNOW_INTEGRATION_ID}
      PAYNOW_INTEGRATION_KEY: ${PAYNOW_INTEGRATION_KEY}
      PAYNOW_MERCHANT_EMAIL: ${PAYNOW_MERCHANT_EMAIL}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

  client:
    build: ./client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
  uploads_data: